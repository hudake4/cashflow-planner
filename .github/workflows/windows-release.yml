name: Windows NSIS release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v0.14.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update Release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    name: Build and publish Windows installer
    needs: [checks, release-please]
    if: >-
      always() && needs.checks.result == 'success' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the desktop app
        run: npm run desktop:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build the NSIS installer without publishing
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.version }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          $installer = "dist-desktop/CashFlow Planner Setup $version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected NSIS installer was not created: $installer"
          }

          gh release upload $env:RELEASE_TAG $installer --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
