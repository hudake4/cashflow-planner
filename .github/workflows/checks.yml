name: Checks

# Runs on pull requests, and is called by windows-release.yml on pushes to
# main, so the release can't publish unless these jobs pass. It has no push
# trigger of its own, otherwise every push to main would run it twice.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: file:./ci.db
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any high or critical advisory except the ones accepted in
      # .github/scripts/audit.mjs (see README, "Known dependency advisories").
      - name: Audit dependencies
        run: node .github/scripts/audit.mjs

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The action needs the repository's Dependency graph, which only an admin can
      # turn on (Settings > Security > Dependency graph). Until that is done the step
      # reports "not supported" and is allowed to fail. Remove continue-on-error once
      # the graph is enabled so the review becomes blocking.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: node {0}
        run: |
          const title = process.env.PR_TITLE;
          const re = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+/;
          if (!re.test(title)) {
            console.error(`::error::PR title "${title}" is not a Conventional Commit.`);
            console.error("Expected: type(scope): description, for example fix(calendar): keep week totals aligned.");
            process.exit(1);
          }

      - name: Check every non-merge commit follows Conventional Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1000
          mapfile -t subjects < <(git log --no-merges "origin/$BASE_REF..HEAD" --format=%s)
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          for subject in "${subjects[@]}"; do
            if [[ ! "$subject" =~ $re ]]; then
              echo "::error::Commit subject is not a Conventional Commit: $subject"
              exit 1
            fi
          done
          echo "All ${#subjects[@]} non-merge commit subjects follow Conventional Commits."
