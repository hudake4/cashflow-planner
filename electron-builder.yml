# Windows installer for the CashFlow Planner desktop app. Build with `npm run desktop:dist`.
appId: com.cashflowplanner.desktop
productName: CashFlow Planner
directories:
  output: dist-desktop
  buildResources: build

# app.asar holds only the compiled Electron main process. Everything it needs at
# runtime lives in resources/ (below), unpacked, so Next can chdir into it and
# Prisma can load its native query engine without asarUnpack path juggling.
files:
  - electron/dist/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: .next/standalone
    to: server
    filter: ["**/*"]
  # electron-builder always skips a folder named node_modules inside a copied tree,
  # so the standalone node_modules is copied by its own entry.
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter: ["**/*"]
  - from: prisma/migrations
    to: migrations
    filter: ["**/migration.sql"]
npmRebuild: false

win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CashFlow Planner
  artifactName: "CashFlow Planner Setup ${version}.${ext}"
  # Keep the user's data in %APPDATA% when uninstalling.
  deleteAppDataOnUninstall: false
